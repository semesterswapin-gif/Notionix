<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notionix – Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar: summaries of every note, click (or Enter) to edit -->
<aside class="sidebar" aria-label="Notes">
  <div class="brand"><h1>Notionix</h1><p id="count">0 notes</p></div>
  <div class="search">
    <input id="search" type="search" placeholder="Search notes  ( / )" aria-label="Search notes by title or content">
  </div>
  <ul class="list" id="list"></ul>
</aside>

<!-- Editor -->
<main class="stage">
  <section class="sheet" aria-label="Note editor">
    <div class="blank" id="blank">
      <h2>Nothing open</h2>
      <p>Pick a note from the list, or press the + button to start a new one.</p>
    </div>
    <div id="editor" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="bar" role="toolbar" aria-label="Formatting">
        <button class="tool back" id="back" aria-label="Back to notes">‹ Notes</button>
        <button class="tool" data-cmd="bold" aria-pressed="false" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="tool" data-cmd="italic" aria-pressed="false" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="tool" data-cmd="underline" aria-pressed="false" aria-label="Underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <button class="tool" data-cmd="insertUnorderedList" aria-pressed="false" aria-label="Bulleted list" title="Bulleted list">• List</button>
        <span class="sp"></span>
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <button class="tool danger" id="delete">Delete</button>
      </div>
      <input class="title" id="title" placeholder="Untitled note" aria-label="Note title" maxlength="120">
      <div class="body" id="body" contenteditable="true" role="textbox" aria-multiline="true"
           aria-label="Note content" data-placeholder="Start writing…" spellcheck="true"></div>
    </div>
  </section>
</main>

<button class="fab" id="add" aria-label="New note (Alt+N)" title="New note (Alt+N)">+</button>
<div class="toast hidden" id="toast" role="status"><span>Note deleted</span><button id="undo">Undo</button></div>

<script src="script.js"></script>
</body>
</html>
